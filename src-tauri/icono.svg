<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3182f6"/>
      <stop offset="1" stop-color="#1c62e9"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59a5ff"/>
      <stop offset="1" stop-color="#174ec6"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#fondo)"/>

  <!-- Moneda / círculo interior -->
  <circle cx="256" cy="256" r="168" fill="url(#brillo)" opacity="0.25"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.35"/>

  <!-- Letras CV -->
  <text x="256" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="200"
        font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central"
        letter-spacing="-8">CV</text>

  <!-- Barra de crecimiento (analítica) -->
  <g fill="#ffffff" opacity="0.9">
    <rect x="176" y="330" width="28" height="40" rx="6"/>
    <rect x="222" y="312" width="28" height="58" rx="6"/>
    <rect x="268" y="288" width="28" height="82" rx="6"/>
    <rect x="314" y="266" width="28" height="104" rx="6"/>
  </g>
</svg>
