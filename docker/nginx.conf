# Configuración de nginx para servir el sitio estático de ContaVen.
# Todas las rutas caen en index.html para que el enrutado del lado del
# cliente (Next.js) funcione al recargar cualquier página.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Archivos estáticos con caché larga
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cualquier otra ruta: se prueba el archivo real y si no, index.html
    location / {
        try_files $uri $uri/index.html $uri.html /index.html;
    }
}
