name: Empaquetar la app de escritorio

# Genera los instaladores de escritorio de ContaVen y los publica como
# "release" en GitHub, para que el usuario los pueda descargar y ejecutar
# directamente sin instalar nada más.
#
#   - Windows: ejecutable portable (Electron 22, compatible con Windows 7 y 10)
#   - Linux:   .AppImage (se ejecuta con doble clic) y .deb
#   - macOS:   .dmg
#
# En Windows se usa Electron 22 porque es la última versión que funciona en
# Windows 7 sin instalar WebView2. El resto de sistemas sigue usando Tauri.
#
# Se puede lanzar a mano (workflow_dispatch) o al subir una etiqueta que
# empiece con "v" (por ejemplo v1.1.0).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  empaquetar:
    name: Empaquetar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Usar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Guardar la caché de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependencias de Linux (para Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Instalar dependencias de la web
        run: npm ci

      - name: Empaquetar y publicar el release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_URL_API: ${{ secrets.NEXT_PUBLIC_URL_API }}
        with:
          tauriScript: npx tauri
          # Se crea (o actualiza) un release con la etiqueta elegida
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          releaseName: 'ContaVen ${{ github.ref_type == ''tag'' && github.ref_name || github.run_number }}'
          releaseBody: 'Descarga el archivo de tu sistema. En Linux usa el .AppImage; en macOS el .dmg. Para Windows 7 o 10 descarga el ejecutable portable, que no necesita instalación.'
          releaseDraft: false
          prerelease: false

  windows-portable:
    name: Windows portable (Electron 22)
    needs: empaquetar
    if: always()
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Usar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_URL_API: ${{ secrets.NEXT_PUBLIC_URL_API }}

      - name: Crear el ejecutable portable
        run: npx electron-builder --win portable --publish never

      - name: Publicar el portable en el release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          name: 'ContaVen ${{ github.ref_type == ''tag'' && github.ref_name || github.run_number }}'
          body: |
            ## ContaVen ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}

            ### Windows 7 y Windows 10 (portable)

            Descarga **ContaVen-*-Windows-Portable.exe** y ejecútalo directamente.
            No hace falta instalar nada ni tener WebView2.

            - Funciona en Windows 7 SP1 (con las actualizaciones de seguridad al día) y Windows 10 de 64 bits.
            - La primera vez, Windows puede mostrar el aviso de SmartScreen porque el archivo no está firmado digitalmente. Pulsa **Más información > Ejecutar de todas formas**.
            - Los datos de la app se guardan en la carpeta de usuario de Windows, no dentro del .exe.

            ### Linux y macOS

            Descarga el .AppImage en Linux o el .dmg en macOS.
          files: release-electron/ContaVen-*-Windows-Portable.exe
          fail_on_unmatched_files: true
