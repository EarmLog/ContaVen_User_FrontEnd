name: Desplegar la app de Usuarios en Vercel

# Este workflow solo empuja el proyecto a Vercel en cada push a main.
# El deploy corre en Vercel, no aquí; este flujo solo fuerza la publicación.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: contaven-user-front
  cancel-in-progress: true

jobs:
  desplegar:
    name: Desplegar en Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Usar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar que el build funciona
        run: npm run build

      - name: Desplegar en Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
